            - paragraph [ref=f6e27]: پیش از انتخاب ماشین‌آلات، باید محصول موردنظر، ماده‌ی اولیه و محدودیت‌های پروژه را روشن کرد.
          - figure "تصویر آرشیوی سایت از تجهیزات صنعتی است و به خط فلاف پالپ مشخصی نسبت داده نمی‌شود." [ref=f6e28]:
            - img "نمایی از تجهیزات صنعتی در یکی از تصاویر آرشیوی پالپ ایران" [ref=f6e29]
          - paragraph [ref=f6e31]: این متن، نمونه‌ای فرضی برای نمایش قالب وبلاگ است و شرح یک پروژه‌ی اجراشده نیست.
          - generic [ref=f6e32]:
            - region [ref=f6e33]:
              - heading "ابتدا محصول موردنظر را روشن کنید" [level=2] [ref=f6e34]
              - paragraph [ref=f6e35]: گفت‌وگو درباره‌ی یک خط تولید از شناخت محصولی آغاز می‌شود که قرار است تولید شود. کاربرد نهایی، ویژگی‌های مورد انتظار و دامنه‌ی پروژه کمک می‌کنند پرسش‌های بعدی درباره‌ی مواد اولیه و تجهیزات شکل دقیق‌تری بگیرند.
            - region [ref=f6e36]:
              - heading "ماده‌ی اولیه را در کنار فرایند ببینید" [level=2] [ref=f6e37]
              - paragraph [ref=f6e38]: نوع ماده‌ی اولیه، کیفیت و یکنواختی آن، شیوه‌ی تأمین و شرایط نگهداری از موضوعاتی هستند که باید در ارزیابی اولیه ثبت شوند. جزئیات آماده‌سازی و فرایند به طراحی همان پروژه وابسته است و نباید از یک نمونه‌ی عمومی نتیجه‌گیری شود.
            - region [ref=f6e39]:
              - heading "ماشین‌آلات را به‌صورت یک زنجیره بررسی کنید" [level=2] [ref=f6e40]
              - paragraph [ref=f6e41]: هر بخش از خط باید در ارتباط با بخش‌های دیگر و نیازهای محل پروژه بررسی شود. فضای در دسترس، زیرساخت‌ها، نگهداری و محدوده‌ی خدمات موردنیاز، کنار مشخصات محصول و خوراک، تصویر کامل‌تری از مسئله می‌سازند.
            - region [ref=f6e42]:
              - heading "برای گفت‌وگوی فنی چه چیزهایی آماده کنیم؟" [level=2] [ref=f6e43]
              - paragraph [ref=f6e44]: شرح محصول هدف، اطلاعات موجود درباره‌ی ماده‌ی اولیه، وضعیت محل اجرا و پرسش‌های باز پروژه، شروع مناسبی برای ارزیابی هستند. هر داده‌ی ناموجود را بهتر است به‌عنوان موضوع نیازمند بررسی ثبت کنیم، نه اینکه برای آن عددی فرضی در نظر بگیریم.
